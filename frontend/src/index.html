<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasty Flavors</title>
  <!-- Bootstrap Library -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <main>
    <div class="container-fluid">
      <div class="row justify-content-center align-items-center">
        <div class="col-6 login-form">
          <div class="row justify-content-center align-items-center">
            <div class="col-8">
              <h1>
                Bem-vindo de volta!
              </h1>
              <p>Preencha as informações abaixo para acessar sua conta</p>
              <form action="/login">
                <div class="form-floating mb-3">
                  <input type="email" class="form-control" id="email" placeholder="Digite seu email">
                  <label for="email">Email</label>
                </div>
                <div class="form-floating mb-3">
                  <input type="password" class="form-control" id="password">
                  <label for="password">Senha</label>
                </div>
                <div class="row mb-3">
                  <button type="submit" class="btn btn-success">Entrar</button>
                </div>
              </form>
              <hr>
              <div class="row justify-content-between">
                <div class="col-6 text-end">
                  <button class="btn btn-outline-dark">
                    <svg aria-hidden="true" class="svg-icon" width="18" height="18" viewBox="0 0 18 18">
                      <g>
                        <path
                          d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"
                          fill="#4285F4"></path>
                        <path
                          d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"
                          fill="#34A853"></path>
                        <path d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z" fill="#FBBC05">
                        </path>
                        <path
                          d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"
                          fill="#EA4335"></path>
                      </g>
                    </svg>
                    Entrar com Google
                  </button>
                </div>
                <div class="col-6 text-start">
                  <button class="btn btn-outline-dark">
                    
                    Entrar com Apple
                  </button>
                </div>
                <div class="col-12 my-3 text-center">
                  <p>Não tem uma conta? <a href="#">Registrar-se</a></p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 login-image">

        </div>
      </div>
    </div>

  </main>
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
